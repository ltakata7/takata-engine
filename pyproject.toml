[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takata-engine"
version = "0.1.10"
description = "Shared analytical library: indicators, microstructure trackers, pricing, regime detection, signals, ML, macro, research, risk. Used by takata-trading, takata-wealth, and sympatheia-os."
requires-python = ">=3.9"
dependencies = [
    # Core numerical
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    # Data / HTTP
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2.30",
    "python-dotenv>=1.0",
    # LLM
    "anthropic>=0.39",
    # Pricing / vol
    "py_vollib>=1.0",
    # Macro / FRED
    "fredapi>=0.5",
    # Time / config
    "pytz>=2024.1",
    "pyyaml>=6.0",
    # Viz (used in dashboards)
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
live = [
    # IBKR execution + Windows-only Profit Ultra COM
    "ib_insync>=0.9",
    "nest_asyncio>=1.5",
    "pywin32>=306; sys_platform == 'win32'",
    "xlwings>=0.31; sys_platform == 'win32'",
]
all = ["takata-engine[dev,live]"]

[tool.setuptools.packages.find]
include = ["takata_engine*"]

# Ship non-Python data files bundled inside the wheel. The YAML configs
# live under takata_engine/config/ and are read at runtime by
# takata_engine.config.loader.load_config() — without this block, setuptools
# builds a wheel that contains loader.py but NOT mes_config.yaml /
# wdo_config.yaml, so every consumer's load_config("MES") raises
# FileNotFoundError on a fresh install. See v0.1.4 release notes.
[tool.setuptools.package-data]
takata_engine = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
